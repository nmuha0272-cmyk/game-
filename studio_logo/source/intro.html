<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Osw; font-weight: 700; src: url(oswald700.woff2); }
@font-face { font-family: Osw; font-weight: 400; src: url(oswald400.woff2); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// The studio logo's opening, one frame at a time: render(t) draws second t.
const W = 1920, H = 1080;
const c = document.getElementById("c"), g = c.getContext("2d");
const L = document.createElement("canvas"); L.width = W; L.height = H; const lg = L.getContext("2d");
const WHITE = "#e9e4da", RED = "#b0141c";
const CX = W / 2, SY = 330, R = 170, TY = 770;

let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => { v = clamp01(v); return 1 - Math.pow(1 - v, 3); };

// The signal's shape (fixed).
seed = 11;
const SIGNAL = (() => {
  const pts = [], left = CX - R - 120, right = CX + R + 120;
  for (let px = left; px <= right; px += 4) {
    const t = (px - CX) / R; let dy = 0;
    if (t > -0.75 && t < -0.15) dy = (rnd() - 0.5) * 22 * (1 - Math.abs(t + 0.45) / 0.3);
    pts.push([px, SY + dy]);
  }
  const spike = [[CX - 0.12 * R, SY], [CX - 0.02 * R, SY + 0.78 * R], [CX + 0.1 * R, SY - 0.62 * R], [CX + 0.2 * R, SY + 0.18 * R], [CX + 0.27 * R, SY]];
  return pts.filter(p => p[0] < spike[0][0]).concat(spike, pts.filter(p => p[0] > spike[spike.length - 1][0]));
})();
const SIG_LEFT = SIGNAL[0][0], SIG_RIGHT = SIGNAL[SIGNAL.length - 1][0];

// TV static pictures (made once).
const NOISE = [];
for (let k = 0; k < 8; k++) {
  const n = document.createElement("canvas"); n.width = 480; n.height = 270;
  const ng = n.getContext("2d"), img = ng.createImageData(480, 270);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ng.putImageData(img, 0, 0); NOISE.push(n);
}

// ---- the parts of the logo -------------------------------------------------

function drawSignal(t, drawTo, flat, heat) {
  // drawTo: how far along (x) the line is drawn. flat: 0..1 how flat it goes at the end.
  lg.save();
  lg.shadowColor = "rgba(230,20,30," + (0.6 + 0.4 * heat) + ")"; lg.shadowBlur = 20 + 40 * heat;
  lg.strokeStyle = heat > 0.01 ? "rgb(" + Math.round(176 + 79 * heat) + "," + Math.round(20 + 90 * heat) + "," + Math.round(28 + 80 * heat) + ")" : RED;
  lg.lineWidth = 9 + 4 * heat; lg.lineJoin = "miter"; lg.miterLimit = 10;
  lg.beginPath();
  let first = true;
  for (const p of SIGNAL) {
    if (p[0] > drawTo) break;
    // a little live wobble in the static part
    const live = Math.abs(p[1] - SY) < 15 && p[0] < CX - 0.12 * R ? (hash(p[0] + Math.floor(t * 20)) - 0.5) * 8 : 0;
    const y = SY + (p[1] - SY + live) * (1 - flat);
    if (first) { lg.moveTo(p[0], y); first = false; } else lg.lineTo(p[0], y);
  }
  lg.stroke();
  // the bright dot at the front while it draws
  if (drawTo < SIG_RIGHT) {
    lg.fillStyle = "#ffd0d0"; lg.shadowBlur = 30;
    lg.beginPath(); lg.arc(drawTo, SY, 7, 0, Math.PI * 2); lg.fill();
  }
  lg.restore();
}

function drawRing(amount, screen) {
  // the TV-screen fill and scan lines
  if (screen > 0) {
    lg.save(); lg.globalAlpha = screen;
    lg.beginPath(); lg.arc(CX, SY, R - 10, 0, Math.PI * 2); lg.clip();
    lg.fillStyle = "#0d0d0d"; lg.fillRect(CX - R, SY - R, R * 2, R * 2);
    lg.fillStyle = "rgba(233,228,218,0.06)";
    for (let yy = SY - R; yy < SY + R; yy += 8) lg.fillRect(CX - R, yy, R * 2, 3);
    lg.restore();
  }
  if (amount <= 0) return;
  lg.strokeStyle = WHITE; lg.lineWidth = 12;
  const gap = 0.16, half = (Math.PI - 2 * gap) * amount;
  // grows out both ways from the gaps
  lg.beginPath(); lg.arc(CX, SY, R, gap, gap + half); lg.stroke();
  lg.beginPath(); lg.arc(CX, SY, R, Math.PI + gap, Math.PI + gap + half); lg.stroke();
}

const WORD = "DEEP STATIC";
function drawTitle(t, start) {
  // Each letter flickers on like a broken sign, at its own time.
  lg.save();
  lg.textBaseline = "alphabetic"; lg.font = "700 190px Osw";
  const spacing = 14;
  if ("letterSpacing" in lg) lg.letterSpacing = spacing + "px";
  const full = lg.measureText(WORD).width;
  if ("letterSpacing" in lg) lg.letterSpacing = "0px";
  let x = CX - full / 2;
  for (let i = 0; i < WORD.length; i++) {
    const ch = WORD[i], w = lg.measureText(ch).width + spacing;
    const on = start + [0.15, 0.55, 0.35, 0.7, 0, 0.25, 0.8, 0.05, 0.6, 0.4, 0.9][i] * 0.75;
    const since = t - on;
    let a = 0;
    if (since > 0) {
      a = 1;
      if (since < 0.35) a = hash(i * 13 + Math.floor(t * 30)) > 0.45 ? 1 : 0.1;  // flicker
    }
    // one letter that stays a bit broken
    if (i === 8 && since > 0.35 && hash(Math.floor(t * 12) + 99) > 0.9) a = 0.25;
    if (a > 0 && ch !== " ") {
      lg.globalAlpha = a * 0.55; lg.fillStyle = RED; lg.fillText(ch, x + 6, TY + 2);
      lg.globalAlpha = a; lg.fillStyle = WHITE; lg.fillText(ch, x, TY);
    }
    x += w;
  }
  lg.restore();
}

function drawGames(amount) {
  if (amount <= 0) return;
  lg.save();
  const gy = TY + 110;
  lg.globalAlpha = clamp01(amount * 1.5);
  lg.textAlign = "center"; lg.font = "400 58px Osw"; lg.fillStyle = RED;
  if ("letterSpacing" in lg) lg.letterSpacing = (38 + (1 - amount) * 60) + "px";
  lg.fillText("GAMES", CX + 19, gy);
  lg.globalAlpha = 1;
  const len = 250 * amount;
  lg.fillRect(CX - 270 - len, gy - 22, len, 4);
  lg.fillRect(CX + 270, gy - 22, len, 4);
  lg.restore();
}

function wear() {
  seed = 7;
  lg.save(); lg.globalCompositeOperation = "destination-out";
  for (let i = 0; i < 2600; i++) {
    const px = rnd() * W, py = 120 + rnd() * 860, s = rnd() * rnd() * 7 + 0.6;
    lg.globalAlpha = 0.35 + rnd() * 0.65; lg.beginPath(); lg.arc(px, py, s, 0, Math.PI * 2); lg.fill();
  }
  for (let i = 0; i < 70; i++) {
    const px = rnd() * W, py = 120 + rnd() * 860, len = 40 + rnd() * 260;
    lg.globalAlpha = 0.25 + rnd() * 0.5; lg.fillRect(px, py, len, 1 + rnd() * 1.5);
  }
  lg.restore();
}

// ---- screen effects --------------------------------------------------------

function staticNoise(t, amount) {
  if (amount <= 0) return;
  g.save(); g.globalAlpha = amount; g.imageSmoothingEnabled = false;
  g.drawImage(NOISE[Math.floor(t * 30) % NOISE.length], 0, 0, W, H);
  g.restore();
}

function glitchBands(t, strength) {
  if (strength <= 0) return;
  const f = Math.floor(t * 30);
  for (let k = 0; k < 6; k++) {
    if (hash(f * 7 + k) > strength) continue;
    const y = Math.floor(hash(f * 3 + k * 11) * H), h = 6 + Math.floor(hash(f + k * 5) * 60);
    const dx = (hash(f * 5 + k) - 0.5) * 140 * strength;
    g.drawImage(c, 0, y, W, h, dx, y, W, h);
    if (hash(f + k * 17) > 0.5) { g.fillStyle = "rgba(176,20,28,0.25)"; g.fillRect(0, y, W, 2); }
  }
}

function filmLook(t) {
  // grain
  g.save(); g.globalAlpha = 0.07; g.globalCompositeOperation = "lighter";
  g.drawImage(NOISE[(Math.floor(t * 30) + 3) % NOISE.length], 0, 0, W, H);
  g.restore();
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.7);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.85)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.fillStyle = "rgba(0,0,0,0.18)";
  for (let yy = 0; yy < H; yy += 4) g.fillRect(0, yy, W, 2);
}

// ---- the timeline ----------------------------------------------------------
//  0.0  static switches on, then fades
//  0.9  the red signal draws across... 2.1 the heartbeat spike (flash)
//  2.2  the TV ring draws around it
//  2.9  DEEP STATIC flickers on, 3.9 GAMES slides out
//  4.6  hold, with glitches; the spike beats again at 5.0
//  6.0  flatline, static, then the old-TV switch-off to black at 7.0
window.DURATION = 7.6;

window.render = function (t) {
  lg.clearRect(0, 0, W, H);
  const bg = g.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, W * 0.62);
  bg.addColorStop(0, "#151313"); bg.addColorStop(1, "#000");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  const drawTo = SIG_LEFT + (SIG_RIGHT - SIG_LEFT) * ease((t - 0.9) / 1.3);
  const beat = (at) => { const d = t - at; return d >= 0 && d < 0.5 ? Math.exp(-d * 8) : 0; };
  const heat = Math.max(beat(2.1), beat(5.0) * 0.8);
  const flat = clamp01((t - 6.0) / 0.25);

  drawRing(ease((t - 2.2) / 0.6), clamp01((t - 2.2) / 0.4));
  if (t > 0.9) drawSignal(t, drawTo, flat, heat);
  drawTitle(t, 2.9);
  drawGames(ease((t - 3.9) / 0.7));
  wear();

  // the logo shakes a little on the heartbeat
  const shake = heat * 8;
  g.drawImage(L, (hash(Math.floor(t * 60)) - 0.5) * shake, (hash(Math.floor(t * 60) + 1) - 0.5) * shake);
  if (heat > 0) { g.fillStyle = "rgba(255,40,40," + (heat * 0.12) + ")"; g.fillRect(0, 0, W, H); }

  // static at the start, and before the switch-off
  const noiseAmt = Math.max(t < 0.9 ? Math.sin(clamp01(t / 0.9) * Math.PI) * 0.9 : 0,
                            t > 6.1 ? clamp01((t - 6.1) / 0.5) * 0.75 : 0);
  staticNoise(t, noiseAmt);

  let glitch = 0;
  if (t > 2.9 && t < 3.5) glitch = 0.35;            // while letters come on
  if (t > 4.95 && t < 5.15) glitch = 0.8;           // the second beat
  if (t > 5.6 && t < 5.7) glitch = 0.6;
  if (t > 6.0 && t < 6.6) glitch = 0.9;
  glitchBands(t, glitch);
  filmLook(t);

  // old TV switching off: squash to a bright line, then a dot, then black
  if (t > 6.6) {
    const k = clamp01((t - 6.6) / 0.35), dot = clamp01((t - 6.95) / 0.25);
    const snap = document.createElement("canvas"); snap.width = W; snap.height = H;
    snap.getContext("2d").drawImage(c, 0, 0);
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    const h = Math.max(3, H * (1 - k)), w = W * (1 - dot);
    if (w > 2) {
      g.drawImage(snap, (W - w) / 2, (H - h) / 2, w, h);
      g.fillStyle = "rgba(255,240,235," + (k * 0.9) + ")"; g.fillRect((W - w) / 2, (H - h) / 2, w, h);
    }
    if (t > 7.25) { g.fillStyle = "#000"; g.fillRect(0, 0, W, H); }
  }
};

document.fonts.load("700 100px Osw").then(() => document.fonts.load("400 50px Osw")).then(() => { document.title = "ready"; });
</script></body></html>
